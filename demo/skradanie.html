<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hobbit — demo: skradanie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
<script>
// Demo stylu A: sylwetki + światło. Wszystkie grafiki rysowane kodem (bez plików).
const VW = 1280, VH = 720, WORLD = 4200, GROUND = 600, END_X = 3700;
const INK = 0x020305, RIM = 0x6f86b8;
const TILT = 0.2, HALF = 0.26, CONE_LEN = 340;     // stożek latarni: pochylenie, pół-kąt, zasięg
const RING_TIME = 3.5, RING_RECHARGE = 2.5;        // sekundy: pełny pierścień / ładowanie w cieniu
const KATAR_UP = 0.05, KATAR_DOWN = 0.2;           // na sekundę: poza cieniem / w cieniu
const FONT = 'Cinzel, Georgia, serif';
const R = Phaser.Math;

class Demo extends Phaser.Scene {
  constructor() { super('demo'); }

  w(o) { this.world.add(o); return o; }
  u(o) { this.ui.add(o); return o; }

  create() {
    this.makeTextures();
    this.world = this.add.layer();
    this.ui = this.add.layer();
    const cam = this.cameras.main;
    this.uiCam = this.cameras.add(0, 0, VW, VH);
    cam.ignore(this.ui);
    this.uiCam.ignore(this.world);
    cam.setBounds(0, 0, WORLD, VH);
    if (cam.postFX) {
      cam.postFX.addBloom(0xffffff, 1, 1, 1, 0.8, 4);
      cam.postFX.addVignette(0.5, 0.5, 0.9, 0.35);
      this.cm = cam.postFX.addColorMatrix();
    }
    this.keys = this.input.keyboard.addKeys('A,D,E,R,SPACE,LEFT,RIGHT');
    this.ring = 1; this.katar = 0; this.ringOn = false;

    this.buildBackground();
    this.buildLevel();
    this.buildUI();

    this.bilbo = this.w(this.add.sprite(230, GROUND, 'bi').setOrigin(0.5, 65 / 70).setDepth(5));
    cam.startFollow(this.bilbo, true, 0.08, 0);
    cam.setFollowOffset(-150, 0);

    this.state = 'play';
    if (!this.registry.get('introShown')) this.intro();
  }

  // ---------- tekstury ----------
  canvasTex(key, w, h, draw) {
    const t = this.textures.createCanvas(key, w, h);
    draw(t.getContext(), w, h);
    t.refresh();
  }
  graphicsTex(key, w, h, draw) {
    const g = this.make.graphics({ x: 0, y: 0, add: false });
    draw(g);
    g.generateTexture(key, w, h);
    g.destroy();
  }
  makeTextures() {
    if (this.textures.exists('glow')) return;
    this.canvasTex('glow', 128, 128, c => {
      const g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.35, 'rgba(255,255,255,0.35)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = g; c.fillRect(0, 0, 128, 128);
    });
    const ch = Math.round(2 * CONE_LEN * Math.tan(HALF));
    this.canvasTex('cone', CONE_LEN, ch, (c, w, h) => {
      const g = c.createLinearGradient(0, 0, w, 0);
      g.addColorStop(0, 'rgba(255,214,150,0.55)');
      g.addColorStop(0.5, 'rgba(255,190,110,0.2)');
      g.addColorStop(1, 'rgba(255,170,90,0)');
      c.fillStyle = g;
      c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, 0); c.lineTo(w, h); c.closePath(); c.fill();
    });
    this.canvasTex('sky', VW, VH, (c, w, h) => {
      const g = c.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#05081a'); g.addColorStop(0.55, '#18213f');
      g.addColorStop(0.8, '#33355e'); g.addColorStop(1, '#4b4472');
      c.fillStyle = g; c.fillRect(0, 0, w, h);
    });
    // Bilbo: mały, kręcone włosy, duże stopy. Obrys księżycowy u góry (RIM), potem sylwetka.
    const bilbo = (g, a) => {
      const parts = (oy, col) => {
        g.fillStyle(col, 1); g.lineStyle(5, col, 1);
        [a, -a].forEach(t => {
          const fx = 30 + Math.sin(t) * 16, fy = 46 + Math.cos(t) * 16 + oy;
          g.lineBetween(30, 46 + oy, fx, fy); g.fillEllipse(fx + 3, fy + 1, 12, 5);
        });
        g.fillEllipse(30, 36 + oy, 22, 24);
        g.lineStyle(4, col, 1); g.lineBetween(31, 30 + oy, 31 - Math.sin(a) * 8, 43 + oy);
        g.fillCircle(31, 18 + oy, 8.5);
        [[25, 14, 4], [29, 11, 4], [34, 11, 3.5], [24, 19, 3.5]].forEach(([x, y, r]) => g.fillCircle(x, y + oy, r));
        g.fillCircle(39.5, 19 + oy, 2);
      };
      parts(-1.6, RIM); parts(0, INK);
    };
    // Elf-strażnik: wysoki, płaszcz, spiczaste ucho, włócznia z tyłu, latarnia z przodu.
    const elf = (g, a) => {
      const parts = (oy, col) => {
        g.fillStyle(col, 1);
        g.lineStyle(3, col, 1); g.lineBetween(22, 8 + oy, 22, 114 + oy);
        g.fillTriangle(22, oy, 18, 10 + oy, 26, 10 + oy);
        g.lineStyle(5, col, 1);
        [a, -a].forEach(t => {
          const fx = 35 + Math.sin(t) * 30, fy = 84 + Math.cos(t) * 30 + oy;
          g.lineBetween(35, 84 + oy, fx, fy); g.fillEllipse(fx + 3, fy + 1, 10, 4);
        });
        g.fillTriangle(36, 28 + oy, 20, 92 + oy, 52, 92 + oy);
        g.fillRect(31, 28 + oy, 10, 30);
        g.lineStyle(4, col, 1);
        g.lineBetween(38, 38 + oy, 55, 56 + oy);
        g.lineBetween(33, 38 + oy, 24, 58 + oy);
        g.fillCircle(37, 20 + oy, 8);
        g.fillTriangle(32, 19 + oy, 24, 10 + oy, 34, 15 + oy);
        g.fillTriangle(31, 14 + oy, 27, 42 + oy, 36, 30 + oy);
        g.fillRect(53, 56 + oy, 7, 10);
      };
      parts(-1.6, RIM); parts(0, INK);
    };
    for (let i = 0; i < 4; i++) {
      this.graphicsTex('b' + i, 60, 70, g => bilbo(g, Math.sin(i * Math.PI / 2) * 0.5));
      this.graphicsTex('e' + i, 70, 120, g => elf(g, Math.sin(i * Math.PI / 2) * 0.35));
    }
    this.graphicsTex('bi', 60, 70, g => bilbo(g, 0.12));
    this.anims.create({ key: 'bwalk', frames: [0, 1, 2, 3].map(i => ({ key: 'b' + i })), frameRate: 10, repeat: -1 });
    this.anims.create({ key: 'ewalk', frames: [0, 1, 2, 3].map(i => ({ key: 'e' + i })), frameRate: 6, repeat: -1 });
  }

  // ---------- tło (paralaksa) ----------
  buildBackground() {
    this.w(this.add.image(0, 0, 'sky').setOrigin(0).setScrollFactor(0).setDepth(-100));

    const st = this.w(this.add.graphics().setScrollFactor(0.03).setDepth(-99));
    for (let i = 0; i < 180; i++) {
      st.fillStyle(0xffffff, R.FloatBetween(0.2, 0.9));
      st.fillCircle(R.Between(0, 1500), R.Between(0, 420), Math.random() < 0.1 ? 1.6 : 0.9);
    }
    for (let i = 0; i < 14; i++) {
      const s = this.w(this.add.image(R.Between(0, 1500), R.Between(0, 380), 'glow')
        .setScale(0.06).setScrollFactor(0.03).setDepth(-99).setBlendMode('ADD'));
      this.tweens.add({ targets: s, alpha: 0.15, duration: R.Between(800, 2200), yoyo: true, repeat: -1, delay: R.Between(0, 2000) });
    }

    const mx = 980, my = 130;
    this.w(this.add.image(mx, my, 'glow').setScale(4).setTint(0x8fa6d8).setAlpha(0.5)
      .setScrollFactor(0.08).setDepth(-98).setBlendMode('ADD'));
    const moon = this.w(this.add.graphics().setScrollFactor(0.08).setDepth(-97));
    moon.fillStyle(0xeef1f8, 1).fillCircle(mx, my, 36);
    moon.fillStyle(0xcfd6e6, 1).fillCircle(mx - 10, my - 8, 7).fillCircle(mx + 12, my + 10, 5).fillCircle(mx + 4, my - 16, 4);

    // Samotna Góra i dalekie pasma
    const far = this.w(this.add.graphics().setScrollFactor(0.2).setDepth(-90));
    far.fillStyle(0x27304d, 1).fillPoints([
      { x: -50, y: VH }, { x: -50, y: 520 }, { x: 150, y: 470 }, { x: 300, y: 330 }, { x: 380, y: 200 },
      { x: 430, y: 180 }, { x: 470, y: 215 }, { x: 560, y: 330 }, { x: 720, y: 450 }, { x: 900, y: 500 },
      { x: 1100, y: 470 }, { x: 1300, y: 500 }, { x: 1500, y: 455 }, { x: 1700, y: 490 }, { x: 2100, y: 470 }, { x: 2100, y: VH }
    ], true);
    this.w(this.add.image(425, 505, 'glow').setScale(0.35).setTint(0xffa050).setScrollFactor(0.2).setDepth(-89).setBlendMode('ADD'));

    // bliższe wzgórza z sosnami
    const mid = this.w(this.add.graphics().setScrollFactor(0.5).setDepth(-80));
    const hill = x => 530 + Math.sin(x * 0.004) * 25 + Math.sin(x * 0.011) * 12;
    const pts = [{ x: -50, y: VH }];
    for (let x = -50; x <= 3100; x += 60) pts.push({ x, y: hill(x) });
    pts.push({ x: 3100, y: VH });
    mid.fillStyle(0x151b2e, 1).fillPoints(pts, true);
    for (let i = 0; i < 60; i++) {
      const x = R.Between(0, 3000), base = hill(x) + 4, h = R.Between(30, 70);
      mid.fillTriangle(x, base - h, x - h * 0.25, base, x + h * 0.25, base);
    }

    // mgła
    for (let i = 0; i < 12; i++) {
      const f = this.w(this.add.image(R.Between(0, 3600), R.Between(520, 600), 'glow')
        .setScale(R.FloatBetween(6, 11), R.FloatBetween(1.2, 2)).setTint(0x9aaad6).setAlpha(0.09)
        .setScrollFactor(0.75).setDepth(-70).setBlendMode('ADD'));
      this.tweens.add({ targets: f, x: f.x + R.Between(120, 260), duration: R.Between(9000, 16000), yoyo: true, repeat: -1, ease: 'Sine.inOut' });
    }

    // ziemia
    const gr = this.w(this.add.graphics().setDepth(0));
    gr.fillStyle(0x05060a, 1).fillRect(0, GROUND, WORLD, VH - GROUND);
    gr.lineStyle(2, INK, 1);
    for (let x = 0; x < WORLD; x += 4) gr.lineBetween(x, GROUND + 1, x + R.Between(-2, 2), GROUND - R.Between(2, 9));
    gr.lineStyle(1, RIM, 0.35).lineBetween(0, GROUND, WORLD, GROUND);

    // trawa na pierwszym planie (szybsza paralaksa = głębia)
    const fg = this.w(this.add.graphics().setScrollFactor(1.25).setDepth(20));
    fg.lineStyle(3, INK, 1);
    for (let i = 0; i < 35; i++) {
      const x = R.Between(400, 5000), n = R.Between(5, 10);
      for (let k = 0; k < n; k++) fg.lineBetween(x + k * 4, VH, x + k * 4 + R.Between(-15, 15), VH - R.Between(60, 150));
    }
  }

  // ---------- poziom ----------
  buildLevel() {
    // mur Góry i lina na starcie
    const wall = this.w(this.add.graphics().setDepth(2));
    wall.fillStyle(INK, 1).fillRect(0, 150, 170, GROUND - 150);
    for (let x = 0; x < 170; x += 34) wall.fillRect(x, 128, 20, 24);
    wall.lineStyle(1.5, RIM, 0.5).lineBetween(170, 150, 170, GROUND);
    wall.lineStyle(2, 0x8c7b58, 1);
    new Phaser.Curves.QuadraticBezier(new R.Vector2(176, 140), new R.Vector2(205, 380), new R.Vector2(188, GROUND - 4)).draw(wall, 24);

    this.rocks = [600, 1350, 1900, 2750, 3500].map((x, i) => this.makeRock(x, 120 + (i % 2) * 30, 75 + (i % 3) * 10));

    this.guards = [
      { x1: 800, x2: 1200, speed: 55 },
      { x1: 2100, x2: 2600, speed: 70 },
      { x1: 3000, x2: 3400, speed: 60 },
    ].map(c => this.makeGuard(c));
    this.campGuards = [
      this.makeGuard({ x1: 3880, x2: 3880, camp: true, dir: 1 }),
      this.makeGuard({ x1: 4040, x2: 4040, camp: true, dir: -1 }),
    ];

    // obóz: namioty i ognisko
    const camp = this.w(this.add.graphics().setDepth(2));
    [[3800, 120, 100], [4140, 160, 130], [4300, 110, 90]].forEach(([x, w, h]) => {
      camp.fillStyle(INK, 1).fillTriangle(x, GROUND - h, x - w / 2, GROUND, x + w / 2, GROUND);
      camp.lineStyle(1.5, 0xc98a4a, 0.6).lineBetween(x, GROUND - h, x + w / 2, GROUND);
      camp.lineStyle(2, INK, 1).lineBetween(x, GROUND - h, x, GROUND - h - 18);
    });
    const fx = 3960;
    camp.lineStyle(5, INK, 1).lineBetween(fx - 22, GROUND, fx + 18, GROUND - 10).lineBetween(fx + 22, GROUND, fx - 18, GROUND - 10);
    const ground = this.w(this.add.image(fx, GROUND, 'glow').setScale(6, 1.3).setTint(0xff7a30).setAlpha(0.55).setBlendMode('ADD').setDepth(1));
    const flame = this.w(this.add.image(fx, GROUND - 22, 'glow').setScale(1.4, 2).setTint(0xff9a40).setBlendMode('ADD').setDepth(7));
    const halo = this.w(this.add.image(fx, GROUND - 30, 'glow').setScale(5).setTint(0xff6a20).setAlpha(0.45).setBlendMode('ADD').setDepth(1));
    this.tweens.add({ targets: [flame, halo, ground], alpha: '-=0.12', duration: 90, yoyo: true, repeat: -1, repeatDelay: 40 });
    this.w(this.add.particles(fx, GROUND - 10, 'glow', {
      speedY: { min: -140, max: -50 }, speedX: { min: -25, max: 25 }, lifespan: { min: 700, max: 1500 },
      scale: { start: 0.12, end: 0 }, alpha: { start: 1, end: 0 },
      tint: [0xffd27a, 0xff8a3d, 0xff5a1f], blendMode: 'ADD', frequency: 35
    }).setDepth(7));

    const hint = (x, t) => this.w(this.add.text(x, 400, t, { fontFamily: FONT, fontSize: '18px', color: '#aab6d6', align: 'center' })
      .setOrigin(0.5).setAlpha(0.75).setDepth(9));
    hint(600, 'Za skałą jesteś w cieniu.\nCień ładuje pierścień i leczy katar.');
    hint(1000, 'Światło latarni zdradza.\nE — załóż pierścień');
  }

  makeRock(x, w, h) {
    const g = this.w(this.add.graphics().setDepth(6));
    const top = [], n = 7;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      top.push({ x: x - w / 2 + t * w + (i % n ? R.Between(-6, 6) : 0), y: GROUND - Math.sin(t * Math.PI) * h * R.FloatBetween(0.8, 1.05) });
    }
    g.fillStyle(INK, 1).fillPoints([{ x: x - w / 2, y: GROUND + 2 }, ...top, { x: x + w / 2, y: GROUND + 2 }], true);
    g.lineStyle(1.5, RIM, 0.55).strokePoints(top);
    return { x, half: w / 2 - 18 };
  }

  makeGuard(c) {
    const s = this.w(this.add.sprite(c.x1, GROUND, 'e0').setOrigin(0.5, 116 / 120).setDepth(4));
    const cone = this.w(this.add.image(0, 0, 'cone').setOrigin(0, 0.5).setBlendMode('ADD').setDepth(3));
    const glow = this.w(this.add.image(0, 0, 'glow').setTint(0xffb35c).setBlendMode('ADD').setDepth(5));
    const mark = this.w(this.add.text(c.x1, GROUND - 150, '', { fontFamily: FONT, fontSize: '44px', color: '#ffd27a', stroke: '#000', strokeThickness: 5 })
      .setOrigin(0.5).setDepth(8));
    this.tweens.add({ targets: glow, alpha: { from: 0.75, to: 1 }, scale: { from: 0.85, to: 1 }, duration: 120 + Math.random() * 120, yoyo: true, repeat: -1 });
    const g = { s, cone, glow, mark, x: c.x1, x1: c.x1, x2: c.x2, speed: c.speed || 0, dir: c.dir || 1, pause: 0, flip: false, alert: 0, camp: !!c.camp };
    cone.setVisible(!g.camp);
    if (!g.camp) s.play('ewalk');
    return g;
  }

  updateGuard(g, dt) {
    if (!g.camp && this.state !== 'fail') {
      if (g.pause > 0) {
        g.pause -= dt;
        if (g.pause <= 0 && g.flip) { g.dir *= -1; g.flip = false; g.s.play('ewalk'); }
      } else {
        g.x += g.dir * g.speed * dt;
        if ((g.x >= g.x2 && g.dir > 0) || (g.x <= g.x1 && g.dir < 0)) {
          g.x = R.Clamp(g.x, g.x1, g.x2); g.pause = 1.4; g.flip = true;
          g.s.stop(); g.s.setTexture('e0');
        }
      }
    }
    g.s.x = g.x; g.s.flipX = g.dir < 0;
    const lx = g.x + 21 * g.dir, ly = GROUND - 55, ang = g.dir > 0 ? TILT : Math.PI - TILT;
    g.glow.setPosition(lx, ly);
    g.cone.setPosition(lx, ly).setRotation(ang);
    g.tri = new Phaser.Geom.Triangle(lx, ly,
      lx + Math.cos(ang - HALF) * CONE_LEN, ly + Math.sin(ang - HALF) * CONE_LEN,
      lx + Math.cos(ang + HALF) * CONE_LEN, ly + Math.sin(ang + HALF) * CONE_LEN);
    g.mark.setPosition(g.x, GROUND - 150);
  }

  // ---------- interfejs ----------
  buildUI() {
    const bar = (y, label, color) => {
      this.u(this.add.text(28, y - 11, label, { fontFamily: FONT, fontSize: '16px', color: '#d9cfb4' }));
      this.u(this.add.rectangle(140, y, 220, 12, 0x000000, 0.55).setOrigin(0, 0.5).setStrokeStyle(1, 0x6b6550));
      return this.u(this.add.rectangle(141, y, 218, 10, color).setOrigin(0, 0.5));
    };
    this.ringBar = bar(36, 'Pierścień', 0xe8c25a);
    this.katarBar = bar(62, 'Katar', 0x7fbf6a);
    this.katarBar.scaleX = 0;
    this.shadowTxt = this.u(this.add.text(28, 84, '', { fontFamily: FONT, fontSize: '15px', color: '#9fb3e0' }));
    this.u(this.add.text(VW / 2, VH - 26, 'A / D — ruch      E — pierścień      R — od nowa',
      { fontFamily: FONT, fontSize: '16px', color: '#b9b09a' }).setOrigin(0.5).setAlpha(0.8));
    this.fade = this.u(this.add.rectangle(0, 0, VW, VH, 0x000000, 0).setOrigin(0).setDepth(-1));
    this.center = this.u(this.add.text(VW / 2, VH / 2 - 40, '', { fontFamily: FONT, fontSize: '46px', color: '#f1e2b8', align: 'center', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5));
    this.sub = this.u(this.add.text(VW / 2, VH / 2 + 40, '', { fontFamily: FONT, fontSize: '20px', color: '#cfc4a6', align: 'center', lineSpacing: 6 }).setOrigin(0.5));
  }

  intro() {
    this.state = 'intro';
    this.fade.fillAlpha = 0.6;
    this.center.setText('Droga do obozu');
    this.sub.setText('Noc. Bilbo wymyka się z Samotnej Góry z Arcyklejnotem w kieszeni.\nDojdź do obozu ludzi i elfów tak, żeby nikt cię nie zobaczył.\n\nNaciśnij dowolny klawisz');
    this.input.keyboard.once('keydown', () => {
      this.registry.set('introShown', true);
      this.state = 'play';
      this.tweens.add({
        targets: [this.center, this.sub, this.fade], alpha: 0, duration: 600,
        onComplete: () => { this.center.setText('').setAlpha(1); this.sub.setText('').setAlpha(1); this.fade.setAlpha(1).fillAlpha = 0; }
      });
    });
  }

  say(x, y, t, d) {
    const tx = this.w(this.add.text(x, y, t, { fontFamily: 'Georgia, serif', fontSize: '20px', color: '#f3e6c4', align: 'center', backgroundColor: 'rgba(5,6,10,0.78)', padding: { x: 12, y: 8 } })
      .setOrigin(0.5, 1).setDepth(30));
    this.tweens.add({ targets: tx, alpha: 0, delay: d, duration: 400, onComplete: () => tx.destroy() });
  }

  setRing(on) {
    this.ringOn = on;
    this.bilbo.setAlpha(on ? 0.18 : 1);
    this.ringBar.fillColor = on ? 0xfff0a8 : 0xe8c25a;
    if (this.cm) on ? this.cm.saturate(-0.75) : this.cm.reset();
    if (on) this.cameras.main.flash(160, 120, 100, 50);
  }

  // ---------- pętla gry ----------
  update(time, delta) {
    const dt = Math.min(delta, 50) / 1000;
    [...this.guards, ...this.campGuards].forEach(g => this.updateGuard(g, dt));
    const K = Phaser.Input.Keyboard, k = this.keys, b = this.bilbo;
    if (K.JustDown(k.R)) { this.scene.restart(); return; }
    if (this.state !== 'play') return;

    const vx = (k.D.isDown || k.RIGHT.isDown ? 1 : 0) - (k.A.isDown || k.LEFT.isDown ? 1 : 0);
    b.x = R.Clamp(b.x + vx * 170 * dt, 200, WORLD - 80);
    if (vx) { b.flipX = vx < 0; b.play('bwalk', true); } else { b.anims.stop(); b.setTexture('bi'); }

    const inShadow = this.rocks.some(r => Math.abs(b.x - r.x) < r.half);
    if (K.JustDown(k.E) || K.JustDown(k.SPACE)) this.setRing(!this.ringOn && this.ring > 0.05);
    if (this.ringOn) {
      this.ring -= dt / RING_TIME;
      if (this.ring <= 0) { this.ring = 0; this.setRing(false); }
    } else if (inShadow) this.ring = Math.min(1, this.ring + dt / RING_RECHARGE);
    this.katar = R.Clamp(this.katar + (inShadow ? -KATAR_DOWN : KATAR_UP) * dt, 0, 1);

    this.ringBar.scaleX = this.ring;
    this.katarBar.scaleX = this.katar;
    this.katarBar.fillColor = this.katar > 0.75 ? (Math.floor(time / 200) % 2 ? 0xd2463a : 0x8a2a22) : 0x7fbf6a;
    this.shadowTxt.setText(inShadow ? '● W cieniu — odpoczywasz' : '');

    if (this.katar >= 1) return this.fail('A-PSIK!', 'Strażnicy usłyszeli kichnięcie.\nWracasz na początek etapu…');

    const visible = !this.ringOn && !inShadow, py = GROUND - 25;
    for (const g of this.guards) {
      const inCone = Phaser.Geom.Triangle.Contains(g.tri, b.x, py);
      g.alert = inCone && visible ? g.alert + dt : Math.max(0, g.alert - dt);
      g.mark.setText(g.alert > 0 ? '!' : (inCone && this.ringOn ? '?' : ''));
      if (g.alert > 0.35) return this.fail('Strażnik cię zauważył!', 'Wracasz na początek etapu…');
    }
    if (b.x >= END_X) this.ending();
  }

  fail(title, sub) {
    this.state = 'fail';
    this.setRing(false);
    this.bilbo.anims.stop();
    const cam = this.cameras.main;
    cam.shake(350, 0.012);
    cam.flash(300, 170, 30, 20);
    this.center.setText(title);
    this.sub.setText(sub);
    this.time.delayedCall(2200, () => this.scene.restart());
  }

  ending() {
    this.state = 'end';
    this.setRing(false);
    const b = this.bilbo, ga = this.campGuards[0];
    b.anims.stop(); b.setTexture('bi'); b.flipX = false;
    this.guards.forEach(g => g.mark.setText(''));
    [
      [300, () => this.say(b.x, GROUND - 80, 'A… a…', 1000)],
      [1500, () => { this.say(b.x, GROUND - 80, 'A-PSIK!', 900); this.cameras.main.shake(250, 0.008); }],
      [2500, () => { ga.dir = -1; ga.cone.setVisible(true); ga.mark.setText('!'); }],
      [3000, () => this.say(ga.x, GROUND - 195, 'Kto tam?!', 1500)],
      [4800, () => { ga.mark.setText(''); this.say(b.x, GROUND - 80, 'Zaprowadźcie mnie do Barda.\nMam dla niego coś bardzo cennego.', 2600); }],
      [7800, () => this.tweens.add({ targets: this.fade, fillAlpha: 1, duration: 1200 })],
      [9200, () => { this.center.setText('Koniec dema'); this.sub.setText('Dalej: Bilbo oddaje Arcyklejnot Bardowi.\n\nR — zagraj jeszcze raz'); }],
    ].forEach(([t, f]) => this.time.delayedCall(t, f));
  }
}

const start = () => {
  window.game = new Phaser.Game({
    type: Phaser.AUTO, width: VW, height: VH, backgroundColor: '#000',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [Demo]
  });
};
(document.fonts ? Promise.race([document.fonts.load('20px Cinzel'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(start);
</script>
