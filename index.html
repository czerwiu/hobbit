    } });

var TPP = class {
  constructor(w, char, { speed = 1.9, run = 4.6, height = 1.1, dist = 4.2, bounds = null } = {}) {
    Object.assign(this, { w, char, speed, runSpeed: run, height, dist, bounds });
    this.pos = V();

    this.camYaw = 0;
    this.camPitch = 0.28;
    this.running = false;
    this.moving = false;
    this.extra = [];

    this.shoulder = 0;
    this.fov = BASE_FOV;
    this.shake = 0;
    this.anims = { idle: "idle", walk: "walk", run: "run" };
    this.step = { len: height < 1.2 ? 0.5 : 0.75, vol: 0.45, rate: height < 1.2 ? 1.15 : 0.95, surface: () => this.running ? "leaves" : "grass" };
    this.stride = 0;
  }
  reset(x, z, yaw = Math.PI) {
    this.pos.set(x, 0, z);

    this.camYaw = yaw - Math.PI;

    this.place();
  }
  look() {

  }
  // ruch względem kamery; zwraca wektor ruchu (lub null)
  move(dt, { canRun = true, anim = true, speed = null, face = true } = {}) {
    const f = (key("KeyW", "ArrowUp") ? 1 : 0) - (key("KeyS", "ArrowDown") ? 1 : 0);
    const r = (key("KeyD", "ArrowRight") ? 1 : 0) - (key("KeyA", "ArrowLeft") ? 1 : 0);
    this.moving = !!(f || r);
    if (!this.moving) {
      this.running = false;
      if (anim) this.char.play(this.anims.idle);
      return null;
    }
    const fx = -Math.sin(this.camYaw), fz = -Math.cos(this.camYaw), len = Math.hypot(f, r);
    const mx = (fx * f - fz * r) / len, mz = (fz * f + fx * r) / len;
    this.running = canRun && key("ShiftLeft", "ShiftRight");
    const sp = speed ?? (this.running ? this.runSpeed : this.speed);
    this.pos.x += mx * sp * dt;
    this.pos.z += mz * sp * dt;
    this.stride += sp * dt;
    if (this.stride > this.step.len * (this.running ? 1.5 : 1)) {
      this.stride = 0;
      footstep(this.step.surface(), { vol: this.step.vol * (this.running ? 1.6 : 1), rate: this.step.rate });
    }
    if (face) this.yaw = angLerp(this.yaw, Math.atan2(mx, mz), damp(12, dt));
    if (anim) this.char.play(this.running ? this.anims.run : this.anims.walk);
    this.collide();

  }
  collide() {
    const b = this.bounds;
    if (b) {
      this.pos.x = clamp(this.pos.x, b[0], b[1]);
      this.pos.z = clamp(this.pos.z, b[2], b[3]);
    }
    for (const k of [...this.w.rocks, ...this.extra]) {
      const dx = this.pos.x - k.x, dz = this.pos.z - k.z, d = Math.hypot(dx, dz), m = k.r * 0.95 + 0.3;
      if (d < m && d > 0) {
        this.pos.x = k.x + dx / d * m;
        this.pos.z = k.z + dz / d * m;
      }
    }
  }
  groundY() {
    return this.w.h(this.pos.x, this.pos.z);
  }
  place(y = null) {
    this.char.root.position.set(this.pos.x, y ?? this.groundY(), this.pos.z);
    this.char.root.rotation.y = this.yaw;
  }
  // kamera za plecami; skała między bohaterem a kamerą przybliża kamerę; shoulder = przesunięcie w prawo (celowanie)
  camera(dt, { dist = this.dist, shoulder = 0, fov = BASE_FOV, y = null } = {}) {
    const k = damp(10, dt);
    this.curDist = lerp(this.curDist, dist, k);
    this.shoulder = lerp(this.shoulder, shoulder, k);
    this.fov = lerp(this.fov, fov, k);
    if (Math.abs(camera.fov - this.fov) > 0.01) {
      camera.fov = this.fov;
      camera.updateProjectionMatrix();
    }
    const baseY = y ?? this.char.root.position.y;
    camTarget.set(this.pos.x, baseY + this.height * 1.05, this.pos.z);
    right.set(Math.cos(this.camYaw), 0, -Math.sin(this.camYaw));
    camTarget.addScaledVector(right, this.shoulder);
    back.set(Math.sin(this.camYaw) * Math.cos(this.camPitch), Math.sin(this.camPitch), Math.cos(this.camYaw) * Math.cos(this.camPitch));
    camRay.set(camTarget, back);

    const d = hit2 ? Math.max(0.6, hit2.distance - 0.3) : this.curDist;

    camWant.y = Math.max(camWant.y, this.w.h(camWant.x, camWant.z) + 0.3);
    const s = this.shake;
    camera.position.copy(camWant).add(V((Math.random() - 0.5) * 2 * s, (Math.random() - 0.5) * 2 * s, 0));
    camera.lookAt(camTarget);
    this.shake = Math.max(0, this.shake - dt * 0.6);
    this.w.focus.copy(this.pos);
    this.w.fill.intensity = 14;
    this.w.fill.position.copy(camTarget).addScaledVector(back, 1.8).y += 0.9;
  }
  // kierunek patrzenia kamery (do przodu, poziomo)
  get viewYaw() {
    return this.camYaw + Math.PI;
  }
};

    say("", kills < NEED ? "Trafiony!" : "Ostatni wr\xF3g pokonany!", 1200);
    if (kills >= NEED) {
      st.state = "end";
      sfx("win");
      center("Zwyci\u0119stwo!", "Bard pokona\u0142 pi\u0119ciu wrog\xF3w.");
      st.at(2600, () => st.finish());
    }
  }
  function shoot() {
    cd = COOLDOWN;
    tpp.yaw = tpp.viewYaw;
    bard.play("shoot", { once: true, then: aiming ? "aim" : "idle", fade: 0.08 });
    ray.setFromCamera({ x: 0, y: 0 }, camera);
    let best = Infinity;
    aimP.copy(ray.ray.origin).addScaledVector(ray.ray.direction, 150);
    for (const r of riders2) if (r.alive) {
      sph.set(V(r.pos.x, r.pos.y + 1.3, r.pos.z), HIT_R);
      if (ray.ray.intersectSphere(sph, tmp)) {
        const d = tmp.distanceTo(ray.ray.origin);
        if (d < best) {
          best = d;
          aimP.copy(tmp);
        }
      }
    }
    const g = ray.intersectObject(w.ground, false)[0];
    if (g && g.distance < best) aimP.copy(g.point);
    bard.root.updateMatrixWorld(true);
    bow.getWorldPosition(start);
    start.y += 0.1;
    const mesh = makeArrow(0.85);
    mesh.position.copy(start);
    w.scene.add(mesh);
    arrows.push({ mesh, pos: start.clone(), vel: aimP.clone().sub(start).normalize().multiplyScalar(ARROW_V), life: 0, fly: true });
    sfx("bow");
  }
  const st = {
    id: "bard-luk",
    w,
    musicVol: 0.3,
    amb: { battle: 0.55, night: 0.3, fire: 0.25 },
    title: "Bard z \u0142ukiem",
    text: "Gobliny na wargach p\u0119dz\u0105 przez pole bitwy.\nPokonaj pi\u0119ciu wrog\xF3w. Strza\u0142a leci \u0142ukiem i opada \u2014 gdy wr\xF3g jest daleko, celuj troch\u0119 wy\u017Cej.",
    keys: "WASD \u2014 ruch \xB7 mysz \u2014 celowanie \xB7 prawy przycisk \u2014 przybli\u017Cenie \xB7 lewy przycisk \u2014 strza\u0142 \xB7 R \u2014 od nowa \xB7 Esc \u2014 pauza \xB7 M \u2014 d\u017Awi\u0119k",
    begin() {
      reset();
      tip("Przytrzymaj prawy przycisk myszy, aby przybli\u017Cy\u0107 widok. Lewy przycisk \u2014 strza\u0142.");
    },
    get kills() {
      return kills;
    },
    get riders() {
      return riders2.map((r) => ({ x: +r.pos.x.toFixed(1), z: +r.pos.z.toFixed(1), alive: r.alive, vis: r.root.visible, inScene: !!r.root.parent }));
    },
    // hak testowy: trafienie najbliższego wroga
    autoKill() {
      const r = riders2.find((x) => x.alive);
      if (r) kill(r);
      else {
        spawn();
        kill(riders2[riders2.length - 1]);
      }
    },
    aimAt(i = 0) {
      const r = riders2.filter((x) => x.alive)[i];
      if (!r) return false;
      const d = V().subVectors(r.pos, tpp.pos);
      tpp.camYaw = Math.atan2(-d.x, -d.z);
      tpp.camPitch = 0.05;
      return true;
    },
    update(dt) {
      const play = st.state === "play";
      if (play && hit("KeyR")) reset();
      if (play) {
        tpp.look();
        aiming = input.buttons.has(2);
        if (aiming) {
          tpp.move(dt, { anim: false, face: false, canRun: false, speed: 1.4 });
          tpp.yaw = angLerp(tpp.yaw, tpp.viewYaw, damp(14, dt));
          if (bard.curName !== "shoot") bard.play("aim", { fade: 0.15 });
        } else if (bard.curName !== "shoot") tpp.move(dt);
        else tpp.move(dt, { anim: false });
        cd -= dt;
        if (input.clicks.has(0) && cd <= 0) shoot();
        spawnT -= dt;
        const alive = riders2.filter((r) => r.alive !== false).length;
        if (spawnT <= 0 && alive < MAX_ALIVE && kills + alive < NEED) {
          spawn();
          spawnT = SPAWN_EVERY;
        }
      }
      $("cross").classList.toggle("aim", aiming);
      for (const r of riders2) {
        if (r.alive === false) {
          r.update(dt);
          continue;
        }
        const dx = tpp.pos.x - r.pos.x, dz = tpp.pos.z - r.pos.z, d = Math.hypot(dx, dz);
        r.root.rotation.y = angLerp(r.root.rotation.y, Math.atan2(dx, dz), damp(5, dt));
        if (st.state !== "play") {
          r.warg.play("idle");
        } else if (d > REACH) {
          const s = Math.min(d - REACH, r.speed * dt);
          r.pos.x += dx / d * s;
          r.pos.z += dz / d * s;
          r.warg.play("run");
        } else {
          r.warg.play("idle");
          r.bite -= dt;
          if (r.bite <= 0) {
            r.bite = BITE_EVERY;
            r.warg.play("attack", { once: true, then: "idle", fade: 0.1 });
            r.gob.play("attack", { once: true, then: "idle" });
            sfx("snarl", { vol: 0.7, vary: 0.12 });
            st.at(350, () => {
              if (r.alive !== false && st.state === "play") {
                sfx("thump", { vol: 0.6 });
                tpp.shake = 0.12;
                $("vigAlert").style.opacity = 0.6;
                setTimeout(() => $("vigAlert").style.opacity = 0, 250);
                sfx("thud");
              }
            });
          }
        }
        for (const o of riders2) if (o !== r && o.alive !== false) {
          const ox = r.pos.x - o.pos.x, oz = r.pos.z - o.pos.z, od = Math.hypot(ox, oz);
          if (od < 2.2 && od > 0) {
            r.pos.x += ox / od * (2.2 - od) * 0.5;
            r.pos.z += oz / od * (2.2 - od) * 0.5;
          }
        }
        r.pos.y = w.h(r.pos.x, r.pos.z);
        r.update(dt);
      }
      for (const a of arrows) {
        if (!a.fly) continue;
        a.life += dt;
        const prev = a.pos.clone();
        a.vel.y -= GRAV2 * dt;
        a.pos.addScaledVector(a.vel, dt);
        a.mesh.position.copy(a.pos);
        a.mesh.lookAt(tmp.copy(a.pos).add(a.vel));
        const seg = new THREE7.Line3(prev, a.pos.clone());
        for (const r of riders2) if (r.alive !== false) {
          const c = V(r.pos.x, r.pos.y + 1.3, r.pos.z);
          if (seg.closestPointToPoint(c, true, tmp).distanceTo(c) < HIT_R) {
            a.fly = false;
            r.gob.root.attach(a.mesh);
            if (st.state === "play") kill(r);
            break;
          }
        }
        if (a.fly && (a.pos.y < w.h(a.pos.x, a.pos.z) || a.life > 6)) a.fly = false;
      }
      while (arrows.length > 30) w.scene.remove(arrows.shift().mesh);
      tickActors(ctx, dt);
      bard.update(dt);
      tpp.place();
      tpp.camera(dt, { dist: aiming ? 1.6 : 3.4, shoulder: aiming ? 0.6 : 0.45, fov: aiming ? 42 : 68 });
    }
  };
  reset();
  return runStage(st);
}

// src/sword.js
import * as THREE8 from "three";
var NEED2 = 5;
var MAX_ALIVE2 = 2;
var HP = 2;
var REACH2 = 2.5;
var ARC = 1.1;
var SWING = 0.8;
var HIT_AT = 280;
var FOE_STOP = 1.7;
var FOE_ATTACK = [1.8, 2.6];
function swordStage() {
  const w = nightWorld({ shadowSize: 50 });
  battlefield(w);
  const ctx = makeCtx(w);
  ctx.duel("ironDwarf", "human", -12, -22, 0.3, { a: { i: 0 }, b: { i: 1 } });
  ctx.duel("ironDwarf", "elf", 10, -26, -0.3, { a: { i: 1 } });
  ctx.duel("dain", "human", -4, -34, 0.1, { b: { i: 3 } });
  ctx.duel("dwarf", "elf", 18, -12, -0.8, { a: { i: 1 }, b: { i: 1 } });
  ctx.duel("ironDwarf", "human", -20, -8, 0.9, { a: { i: 2 }, b: { i: 4 } });
  const thorin = new Char("thorin");
  w.scene.add(thorin.root);
  const tpp = new TPP(w, thorin, { speed: 2.6, run: 5, height: 1.4, dist: 3.4, bounds: [-30, 30, -40, 25] });
  tpp.step.len = 0.6;
  tpp.step.rate = 0.9;
  tpp.step.vol = 0.5;
  const foes = [];
  let kills = 0, spawned = 0, cd = 0, spawnT = 0.5;
  function reset() {
    st.clearTimers && st.clearTimers();
    foes.forEach((f) => {
      w.scene.remove(f.c.root);
      if (f.blade) w.scene.remove(f.blade);
    });
    foes.length = 0;
    kills = 0;
    spawned = 0;
    cd = 0;
    spawnT = 0.5;
    tpp.reset(0, 6, Math.PI);
    center("");
    hud({ counter: `Pokonani: 0 / ${NEED2}`, keys: st.keys });
    if (st.state !== "intro") st.state = "play";
  }
  function spawn() {
    const kind = spawned % 2 ? "elf" : "human";
    const c = new Char(kind, { i: spawned });
    if (kind === "human") c.addSword();
    const a = tpp.viewYaw + rnd(-0.9, 0.9), d = rnd(12, 16);
    const x = Math.max(-28, Math.min(28, tpp.pos.x + Math.sin(a) * d)), z = Math.max(-38, Math.min(22, tpp.pos.z + Math.cos(a) * d));
    c.root.position.set(x, w.h(x, z), z);
    w.scene.add(c.root);
    foes.push({ c, kind, hp: HP, atk: rnd(1, 2), stun: 0, down: false });
    spawned++;
  }
  function defeat(f) {
    f.down = true;
    f.c.play("death", { once: true, fade: 0.1 });
    sfx("fall", { delay: 0.5, vol: 0.8 });
    const s = f.c.sword || f.c.model.getObjectByName("Sword");
    if (s) {
      const p = s.getWorldPosition(V());
      w.scene.attach(s);
      s.position.set(p.x + rnd(-0.6, 0.6), w.h(p.x, p.z) + 0.05, p.z + rnd(-0.6, 0.6));
      s.rotation.set(Math.PI / 2, 0, rnd(0, 6));
      f.blade = s;
    }
    kills++;
    $("counter").textContent = `Pokonani: ${kills} / ${NEED2}`;
    say("", f.kind === "elf" ? "Elf rozbrojony!" : "Wojownik og\u0142uszony!", 1400);
    if (kills >= NEED2) {
      st.state = "end";
      sfx("win");
      thorin.play("idle");
      center("Zwyci\u0119stwo!", "Thorin pokona\u0142 pi\u0119ciu przeciwnik\xF3w.");
      st.at(2600, () => st.finish());
    }
  }
  function swing() {
    cd = SWING;
    tpp.yaw = tpp.viewYaw;
    thorin.root.rotation.y = tpp.yaw;
    thorin.play("attack", { once: true, then: "idle", fade: 0.08, speed: 1.3 });
    sfx("swing", { vol: 0.8 });
    st.at(HIT_AT, () => {
      for (const f of foes) {
        if (f.down) continue;
        const dx = f.c.root.position.x - tpp.pos.x, dz = f.c.root.position.z - tpp.pos.z;
        if (Math.hypot(dx, dz) > REACH2 || Math.abs(angDiff(tpp.yaw, Math.atan2(dx, dz))) > ARC) continue;
        sfx("clash", { vol: 0.9 });
        f.hp--;
        if (f.hp <= 0) defeat(f);
        else {
          f.c.play("hit", { once: true, then: "guard", fade: 0.08 });
          f.stun = 0.9;
          const d = Math.hypot(dx, dz) || 1;
          f.c.root.position.x += dx / d * 0.9;
          f.c.root.position.z += dz / d * 0.9;
        }
      }
    });
  }
  const st = {
    id: "thorin-miecz",
    w,
    musicVol: 0.3,
    amb: { battle: 0.6, night: 0.3, fire: 0.25 },
    title: "Thorin z mieczem",
    text: "Krasnoludy walcz\u0105 z lud\u017Ami i elfami.\nPokonaj pi\u0119ciu przeciwnik\xF3w. Ka\u017Cdy pada po dw\xF3ch ciosach \u2014 og\u0142uszony albo rozbrojony.",
    keys: "WASD \u2014 ruch \xB7 Shift \u2014 bieg \xB7 mysz \u2014 kamera i kierunek ciosu \xB7 lewy przycisk \u2014 cios mieczem \xB7 R \u2014 od nowa \xB7 Esc \u2014 pauza \xB7 M \u2014 d\u017Awi\u0119k",
    begin() {
      reset();
      tip("Obr\xF3\u0107 kamer\u0119 w stron\u0119 przeciwnika i uderz lewym przyciskiem myszy.");
    },
    get kills() {
      return kills;
    },
    autoKill() {
      let f = foes.find((x) => !x.down);
      if (!f) {
        spawn();
        f = foes[foes.length - 1];
      }
      defeat(f);
    },
    update(dt) {
      const play = st.state === "play";
      if (play && hit("KeyR")) reset();
      if (play) {
        tpp.look();
        cd -= dt;
        if (cd > SWING - 0.5) tpp.move(dt, { anim: false, face: false, speed: 0.6 });
        else tpp.move(dt);
        if (input.clicks.has(0) && cd <= 0) swing();
        spawnT -= dt;
        const alive = foes.filter((f) => !f.down).length;
        if (spawnT <= 0 && alive < MAX_ALIVE2 && spawned < NEED2) {
          spawn();
          spawnT = 2.5;
        }
      }
      tpp.extra = foes.filter((f) => !f.down).map((f) => ({ x: f.c.root.position.x, z: f.c.root.position.z, r: 0.4 }));
      for (const f of foes) {
        if (!f.down) {
          const p = f.c.root.position, dx = tpp.pos.x - p.x, dz = tpp.pos.z - p.z, d = Math.hypot(dx, dz);
          f.c.root.rotation.y = angLerp(f.c.root.rotation.y, Math.atan2(dx, dz), damp(6, dt));
          if (st.state !== "play") f.c.play("guard");
          else if (f.stun > 0) f.stun -= dt;
          else if (d > FOE_STOP) {
            const sp = d > 6 ? 3.6 : 2;
            p.x += dx / d * sp * dt;
            p.z += dz / d * sp * dt;
            f.c.play(d > 6 ? "run" : "walk");
          } else {
            if (f.c.curName !== "attack" && f.c.curName !== "hit") f.c.play("guard");
            f.atk -= dt;
            if (f.atk <= 0) {
              f.atk = rnd(...FOE_ATTACK);
              f.c.play("attack", { once: true, then: "guard", fade: 0.1 });
              st.at(420, () => {
                if (f.down || st.state !== "play" || Math.hypot(tpp.pos.x - p.x, tpp.pos.z - p.z) > 2.3) return;
                sfx("clash", { vol: 0.7, rate: 0.9 });
                tpp.shake = 0.1;
                $("vigAlert").style.opacity = 0.5;
                setTimeout(() => $("vigAlert").style.opacity = 0, 250);
                if (cd <= 0) thorin.play("hit", { once: true, then: "idle", fade: 0.08 });
              });
            }
          }
          for (const o of foes) if (o !== f && !o.down) {
            const op = o.c.root.position, ox = p.x - op.x, oz = p.z - op.z, od = Math.hypot(ox, oz);
            if (od < 1.2 && od > 0) {
              p.x += ox / od * (1.2 - od) * 0.5;
              p.z += oz / od * (1.2 - od) * 0.5;
            }
          }
          p.y = w.h(p.x, p.z);
        }
        f.c.update(dt);
      }
      tickActors(ctx, dt);
      thorin.update(dt);
      tpp.place();
      tpp.camera(dt);
    }
  };
  reset();
  return runStage(st);
}

    keys: "WASD \u2014 ruch \xB7 Shift \u2014 bieg \xB7 mysz \u2014 kamera \xB7 E \u2014 pier\u015Bcie\u0144 \xB7 Esc \u2014 pauza \xB7 M \u2014 d\u017Awi\u0119k",

    },

      return ringOn;

// src/autotest.js
var sleep = (ms) => new Promise((r) => setTimeout(r, ms));
var CHOICES = { 1: [true], 2: [false, true], 3: [false, false] };
async function autotest(G) {
  const errors = [], fps = [];
  addEventListener("error", (e) => errors.push(e.message || "zas\xF3b: " + (e.target && (e.target.src || e.target.href))), true);
  addEventListener("unhandledrejection", (e) => errors.push("promise: " + (e.reason && e.reason.message)));
  const ce = console.error;
  console.error = (...a) => {
    errors.push(a.join(" "));
    ce(...a);
  };
  const box = document.createElement("pre");
  box.style.cssText = "position:fixed;left:8px;top:8px;z-index:99;color:#0f0;background:#000c;font:12px monospace;padding:6px;margin:0;max-width:60vw;white-space:pre-wrap";
  document.body.append(box);
  const log = (t) => {
    box.textContent += t + "\n";
    document.title = "AUTOTEST " + t;
  };
  const ends = {};
  for (const path of [1, 2, 3]) {
    const choices = [...CHOICES[path]];
    G.newGame();
    const t0 = Date.now();
    while (Date.now() - t0 < 6 * 6e4) {
      const w = G.waiter;
      if (!w) {
        await sleep(100);
        continue;
      }
      if (w.kind === "line" || w.kind === "card") {
        await sleep(250);
        G.next();
      } else if (w.kind === "choice") {
        await sleep(250);
        G.choose(choices.shift());
      } else if (w.kind === "overlay") {
        G.start();
        await sleep(2500);
        fps.push(window.FPS);
        G.finishStage();
      } else if (w.kind === "ending") {
        ends[path] = document.getElementById("endText").textContent;
        G.skip();
        break;
      } else await sleep(100);
    }
    log(`\u015Bcie\u017Cka ${path}: ${ends[path] ? "OK" : "NIE DOSZ\u0141A DO KO\u0143CA"}`);
    await sleep(800);
  }
  const ok = Object.keys(ends).length === 3 && !errors.length;
  log(`${ok ? "OK" : "B\u0141\u0104D"} zako\u0144czenia=${Object.keys(ends).length}/3 b\u0142\u0119dy=${errors.length} kl/s=${Math.min(...fps)}-${Math.max(...fps)}${errors.length ? " | " + errors.slice(0, 3).join(" | ") : ""}`);
}

// src/main.js
var Q1 = "Czy Bilbo odda Arcyklejnot ludziom i elfom, aby mieli kart\u0119 przetargow\u0105 w rozmowach z Thorinem?";
var Q2 = "Czy Bilbo odda swoj\u0105 cz\u0119\u015B\u0107 skarbu na odbudow\u0119 miasta?";
var ENDINGS = {
  1: "Dzi\u0119ki uczciwo\u015Bci Bilba bitwa zosta\u0142a wygrana. Bilbo mo\u017Ce w spokoju wr\xF3ci\u0107 do domu\u2026",
  2: "Dzi\u0119ki hojno\u015Bci Bilba bitwa zosta\u0142a wygrana. Niestety brak woli walki krasnolud\xF3w doprowadzi\u0142 do \u015Bmierci bardzo wielu ludzi i elf\xF3w\u2026",
  3: "Przez chciwo\u015B\u0107 i zuchwa\u0142o\u015B\u0107 dobro tym razem nie zwyci\u0119\u017Cy\u0142o\u2026"
};
var ABORT = new Error("abort");
var gen = 0;
var flow = { path: [], ending: null };
var blank = new THREE10.Scene();
blank.background = new THREE10.Color(0);
var black = () => setMode({ scene: blank, update() {
} });
async function game() {
  const my = ++gen;
  const s = async (p) => {
    const r = await p;
    if (my !== gen) throw ABORT;
    return r;
  };
  const scenes = async (...ids) => {
    for (const id of ids) {
      flow.path.push(id);
      await s(playScene(id));
    }
  };
  const stage = async (id, f) => {
    flow.path.push(id);
    await s(f());
    black();
  };
  const card2 = async (t, txt, id) => {
    flow.path.push(id);
    black();
    await s(fade(0, 300));
    await s(card(t, txt, id));
    await s(fade(1, 500));
  };
  const choose = async (q, id) => {
    flow.path.push(id);
    const v = await s(choice(q, id));
    await s(fade(1, 700));
    black();
    return v;
  };
  flow.path = [];
  flow.ending = null;
  try {
    hideAll();
    await s(fade(1, 500));
    await scenes("intro-1", "intro-2", "intro-3", "intro-4", "intro-5", "intro-6");
    let end;
    if (await choose(Q1, "wybor-1")) {
      await stage("z1-droga", roadStage);
      await scenes("z1-przekazanie", "z1-negocjacje", "z1-atak", "z1-kamien");
      await card2("Grasz teraz jako Bard", "Bilbo nie mo\u017Ce walczy\u0107.\nBard z \u0142ukiem musi powstrzyma\u0107 gobliny na wargach.", "z1-zmiana");
      await stage("z1-bard", () => bowStage({ dwarves: "fight" }));
      await scenes("z1-goblin-strzela", "z1-bard-krzyk", "z1-thorin-lozko");
      end = 1;
    } else {
      await scenes("z23-negocjacje");
      if (await choose(Q2, "wybor-2")) {
        await scenes("z2-zgoda", "z2-atak");
        await card2("Grasz teraz jako Bard", "Bilbo nie umie walczy\u0107, a krasnoludy nie chc\u0105 walczy\u0107.\nBard z \u0142ukiem musi powstrzyma\u0107 gobliny na wargach.", "z2-zmiana");
        await stage("z2-bard", () => bowStage({ dwarves: "watch" }));
        await scenes("z2-straty", "z2-krol");
        await card2("", "Bitwa zosta\u0142a wygrana, ale okupiona wielkimi stratami po stronie ludzi i elf\xF3w", "z2-napis");
        end = 2;
      } else {
        await scenes("z3-dain");
        await card2("Grasz teraz jako Thorin", "Krasnoludy walcz\u0105 z lud\u017Ami i elfami.\nThorin walczy mieczem.", "z3-zmiana-thorin");
        await stage("z3-thorin-walka", swordStage);
        await scenes("z3-gobliny");
        await card2("Grasz teraz jako Bilbo", "Bilbo nie umie walczy\u0107.\nZa\u0142\xF3\u017C pier\u015Bcie\u0144 i schowaj si\u0119 za kamieniem.", "z3-zmiana-bilbo");
        await stage("z3-bilbo", hideStage);
        await scenes("z3-przegrana", "z3-thorin", "z3-odejscie");
        end = 3;
      }
    }
    flow.ending = end;
    flow.path.push("koniec-" + end);
    black();
    hideAll();
    music(end === 1 ? "main" : "sad", 0.8);
    amb({});
    const again = ending(`Zako\u0144czenie ${end}`, ENDINGS[end], "koniec-" + end);
    await s(fade(0, 900));
    const r = await s(again);
    if (r === "again") game();
    else menu();
  } catch (e) {
    if (e !== ABORT) throw e;
  }
}
function menu() {
  gen++;
  S.active = null;
  setPaused(false);
  unlock();
  dropWaiter();
  hideAll();
  setMode(menuBackdrop());
  show("menu");
  fade(0, 900);
}
async function info(title, html) {
  show("menu", false);
  show("info");
  $("infoTitle").textContent = title;
  $("infoBox").innerHTML = html;
}
$("bStart").onclick = () => {
  show("menu", false);
  game();
};
$("bHow").onclick = () => info("Jak gra\u0107", `
  <h3>O grze</h3><p>Gra opowiada o Bitwie Pi\u0119ciu Armii z powie\u015Bci \u201EHobbit\u201D J.R.R. Tolkiena. Grasz jako hobbit Bilbo. Twoje dwa wybory decyduj\u0105, kt\xF3re z trzech zako\u0144cze\u0144 zobaczysz.</p>
  <h3>Scenki</h3><p>Kliknij albo naci\u015Bnij Spacj\u0119, aby przej\u015B\u0107 dalej.</p>
  <h3>Etapy</h3><ul>
  <li><b>WASD</b> \u2014 ruch, <b>mysz</b> \u2014 kamera (kliknij w gr\u0119, aby przechwyci\u0107 mysz)</li>
  <li><b>Shift</b> \u2014 podbieganie (g\u0142o\u015Bne!), <b>Spacja</b> \u2014 zjazd po linie i skok</li>
  <li><b>E</b> \u2014 pier\u015Bcie\u0144: przez 5 sekund nikt ci\u0119 nie widzi; \u0142aduje si\u0119 przy ska\u0142ach</li>
  <li><b>Lewy przycisk</b> \u2014 strza\u0142 z \u0142uku albo cios mieczem, <b>prawy przycisk</b> \u2014 przybli\u017Cenie przy celowaniu</li>
  <li><b>R</b> \u2014 etap od nowa, <b>Esc</b> \u2014 pauza, <b>M</b> \u2014 wy\u0142\u0105cz albo w\u0142\u0105cz d\u017Awi\u0119k</li></ul>
  <h3>Skradanie</h3><p>Omijaj \u015Bwiat\u0142o latarni elfich stra\u017Cnik\xF3w. Ska\u0142a zas\u0142ania ci\u0119 przed latarni\u0105. Przy skale odpoczywasz: pier\u015Bcie\u0144 si\u0119 \u0142aduje, a katar maleje. Gdy pasek kataru si\u0119 zape\u0142ni, Bilbo kichnie.</p>`);
$("bCredits").onclick = () => info("Autorzy", `
  <h3>Pomys\u0142y, scenariusz i plan gry</h3><p>Filip Czerwi\u0144ski i Tymek Wi\u015Bniewski<br>klasa 6A</p>
  <h3>Realizacja gry</h3><p>Claude Code</p>`);
$("bBack").onclick = () => {
  show("info", false);
  show("menu");
};
$("bMenu2").onclick = () => menu();
addEventListener("keydown", (e) => {
  if (e.code === "KeyM" && !e.repeat) say("", toggleMute() ? "D\u017Awi\u0119k wy\u0142\u0105czony (M)" : "D\u017Awi\u0119k w\u0142\u0105czony (M)", 1500);
});
document.addEventListener("pointerlockchange", () => {
  const st = S.active;
  if (!st) return;
  if (!isLocked() && st.state !== "intro" && st.state !== "done" && !paused) {
    setPaused(true);
    show("overlay");
    $("ovTitle").textContent = "Pauza";
    $("ovText").textContent = "";
    $("ovKeys").textContent = st.keys;
    $("ovGo").textContent = "Kliknij, aby wr\xF3ci\u0107";
  } else if (isLocked() && paused) {
    setPaused(false);
    show("overlay", false);
  }
});
window.G = {
  ready: false,
  get waiter() {
    return currentWaiter();
  },
  get stage() {
    return S.active;
  },
  get scene() {
    return sceneCtx();
  },
  get flow() {
    return flow;
  },
  get fps() {
    return window.FPS;
  },
  get audio() {
    return { music: audioState.music, amb: Object.fromEntries(Object.entries(audioState.amb).filter(([, a]) => a.want > 0).map(([n, a]) => [n, +a.want.toFixed(2)])), muted: isMuted(), sounds: Object.keys(window.SOUNDS || {}).length, decoded: audioState.decoded, failed: audioState.failed, played: audioState.played, peaks: audioState.peaks };
  },
  get sfxLevel() {
    return sfxLevel();
  },
  newGame() {
    show("menu", false);
    game();
  },
  playScene(id) {
    show("menu", false);
    return playScene(id);
  },
  runStage(name, o) {
    show("menu", false);
    return { road: roadStage, bow: bowStage, sword: swordStage, hide: hideStage }[name](o);
  },
  menu,
  start() {
    return resolveWaiter("overlay");
  },
  // start etapu bez kliknięcia
  next() {
    return resolveWaiter("line") || resolveWaiter("card");
  },
  choose(v) {
    return resolveWaiter("choice", v);
  },
  finishStage() {
    return resolveWaiter("stage");
  },
  // pominięcie etapu
  skip() {
    const w = currentWaiter();
    if (!w) return false;
    return resolveWaiter(w.kind, w.kind === "ending" ? "menu" : w.kind === "choice" ? true : void 0);
  }
};
probeImages(SCENE_IDS);
await loadModels((p) => {
  $("loadBar").style.width = p * 100 + "%";
});
show("loading", false);
menu();
window.G.ready = true;
if (/[?&]autotest/.test(location.search)) autotest(window.G);

</script>
