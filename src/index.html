<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hobbit: Bitwa Pięciu Armii</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2710%27 fill=%27none%27 stroke=%27%23e8c25a%27 stroke-width=%275%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Cinzel, Georgia, serif; color: #e9dcb8; user-select: none; -webkit-user-select: none; }
  canvas { display: block; transition: filter .35s; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }
  button { font-family: Cinzel, Georgia, serif; font-size: 20px; color: #f3e6c4; background: rgba(20,16,10,.75); border: 1px solid #8a7a50; padding: 10px 28px; cursor: pointer; min-width: 220px; transition: background .2s, color .2s; }
  button:hover, button:focus-visible { background: rgba(120,90,30,.6); color: #fff; outline: none; }
  #vigRing { background: radial-gradient(ellipse at center, transparent 35%, rgba(40,30,5,.55) 75%, rgba(0,0,0,.9) 100%); opacity: 0; transition: opacity .35s; }
  #vigAlert { background: radial-gradient(ellipse at center, transparent 40%, rgba(170,20,10,.75) 100%); opacity: 0; }
  #fade { background: #000; opacity: 0; transition: opacity .8s; z-index: 20; }
  #plansza { position: fixed; inset: 0; background: #000 center / contain no-repeat; z-index: 5; }
  #hud { position: fixed; top: 22px; left: 26px; font-size: 15px; pointer-events: none; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .row span { width: 96px; }
  .bar { width: 220px; height: 10px; background: rgba(0,0,0,.55); border: 1px solid #6b6550; position: relative; }
  .bar i { display: block; height: 100%; width: 0; }
  #ringBar i { background: #e8c25a; }
  #katarBar i { background: #7fbf6a; }
  #speedBar i { background: #9fb3e0; }
  #speedBar::after { content: ''; position: absolute; right: 0; top: -1px; bottom: -1px; width: 28%; background: rgba(200,40,30,.45); }
  #katarBar.warn i, #speedBar.warn i { animation: blink .4s steps(2) infinite; }
  @keyframes blink { 0% { background: #d2463a; } 100% { background: #8a2a22; } }
  #status { color: #9fb3e0; font-size: 14px; min-height: 18px; }
  #counter { position: fixed; top: 20px; right: 28px; font-size: 26px; color: #f3e6c4; text-shadow: 0 2px 8px #000; pointer-events: none; }
  #cross { position: fixed; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; pointer-events: none; }
  #cross::before, #cross::after { content: ''; position: absolute; background: rgba(255,240,200,.85); box-shadow: 0 0 3px #000; }
  #cross::before { left: 12px; top: 0; width: 2px; height: 26px; }
  #cross::after { top: 12px; left: 0; height: 2px; width: 26px; }
  #cross.aim { transform: scale(.6); }
  #mark { position: fixed; top: 16%; left: 50%; transform: translateX(-50%); font-size: 56px; color: #ffd27a; text-shadow: 0 0 12px #000; pointer-events: none; }
  #tip { position: fixed; top: 24%; left: 50%; transform: translateX(-50%); width: min(680px, 90vw); text-align: center; font-size: 18px; color: #c4cee8; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity .6s; pointer-events: none; }
  #say { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); max-width: min(760px, 90vw); padding: 12px 20px; background: rgba(5,6,10,.8); border: 1px solid #4a4536; font-family: Georgia, serif; font-size: 20px; color: #f3e6c4; text-align: center; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #say b, #dlg b { color: #e8c25a; font-family: Cinzel, Georgia, serif; font-weight: 600; }
  #say b { margin-right: 8px; }
  #center { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; padding: 0 16px; }
  #center h1 { font-size: 46px; margin: 0 0 14px; text-shadow: 0 3px 10px #000; }
  #center p { font-size: 20px; margin: 0; line-height: 1.6; color: #cfc4a6; text-shadow: 0 2px 6px #000; white-space: pre-line; }
  #keys { position: fixed; bottom: 18px; width: 100%; text-align: center; font-size: 15px; color: #b9b09a; opacity: .8; pointer-events: none; }
  #dlg { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); width: min(900px, calc(100vw - 32px)); box-sizing: border-box; padding: 16px 24px 30px; background: linear-gradient(rgba(8,8,14,.88), rgba(4,4,8,.94)); border: 1px solid #6b5f3c; box-shadow: 0 6px 30px rgba(0,0,0,.6); z-index: 10; cursor: pointer; }
  #dlg b { display: block; font-size: 17px; margin-bottom: 6px; letter-spacing: .5px; }
  #dlg p { margin: 0; font-family: Georgia, serif; font-size: 21px; line-height: 1.55; color: #f3e6c4; }
  #dlg p.narr { font-style: italic; color: #d8cfb6; }
  #dlg small { position: absolute; right: 16px; bottom: 8px; font-size: 12px; color: #a99c78; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; box-sizing: border-box; z-index: 15; }
  .screen h1 { font-size: clamp(30px, 6vw, 60px); margin: 0 0 10px; text-shadow: 0 4px 18px #000; color: #f0d890; }
  .screen h2 { font-size: clamp(18px, 3vw, 26px); margin: 0 0 30px; color: #cfc4a6; font-weight: 600; text-shadow: 0 2px 8px #000; }
  .screen p { font-family: Georgia, serif; font-size: 20px; line-height: 1.6; color: #e8dcc0; max-width: 780px; margin: 0 0 24px; white-space: pre-line; text-shadow: 0 2px 6px #000; }
  .screen .btns { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .screen .btns.row2 { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  #menu { background: radial-gradient(ellipse at center, rgba(0,0,0,.05) 30%, rgba(0,0,0,.65) 100%); }
  #info { background: rgba(0,0,0,.82); }
  #info .box { max-width: 820px; max-height: 70vh; overflow: auto; text-align: left; font-family: Georgia, serif; font-size: 17px; line-height: 1.55; color: #e8dcc0; margin-bottom: 22px; padding: 0 8px; }
  #info .box h3 { font-family: Cinzel, Georgia, serif; color: #e8c25a; margin: 18px 0 6px; font-size: 19px; }
  #info .box ul { margin: 4px 0; padding-left: 22px; }
  #info .box a { color: #9fb3e0; }
  #choice { background: rgba(0,0,0,.55); }
  #choice p { font-size: 24px; }
  #card { background: rgba(0,0,0,.72); cursor: pointer; }
  #card .go, #overlay .go { font-size: 20px; color: #e8c25a; margin-top: 8px; animation: pulse 1.6s infinite; }
  #ending { background: #050508; }
  #ending p { font-size: 24px; font-style: italic; }
  #overlay { background: rgba(0,0,0,.62); cursor: pointer; }
  #overlay .keys2 { font-size: 15px; color: #b9b09a; margin-bottom: 18px; }
  #loading { background: #000; z-index: 30; }
  #loading .bar { width: 320px; margin-top: 16px; }
  #loading .bar i { background: #e8c25a; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<!--MODELS-->
<script src="assets/plansze/lista.js"></script>
</head>
<body>
<div id="game"></div>
<div id="plansza" class="hidden"></div>
<div id="vigRing" class="layer"></div>
<div id="vigAlert" class="layer"></div>
<div id="hud" class="hidden">
  <div class="row" id="ringRow"><span>Pierścień</span><div class="bar" id="ringBar"><i></i></div></div>
  <div class="row" id="katarRow"><span>Katar</span><div class="bar" id="katarBar"><i></i></div></div>
  <div class="row" id="speedRow"><span>Prędkość</span><div class="bar" id="speedBar"><i></i></div></div>
  <div id="status"></div>
</div>
<div id="counter" class="hidden"></div>
<div id="cross" class="hidden"></div>
<div id="mark"></div>
<div id="tip"></div>
<div id="say"></div>
<div id="center"><h1 id="title"></h1><p id="sub"></p></div>
<div id="keys" class="hidden"></div>
<div id="dlg" class="hidden"><b id="dlgWho"></b><p id="dlgText"></p><small>kliknij lub Spacja — dalej</small></div>

<div id="menu" class="screen hidden">
  <h1>Hobbit</h1>
  <h2>Bitwa Pięciu Armii</h2>
  <div class="btns">
    <button id="bStart">Start</button>
    <button id="bHow">Jak grać</button>
    <button id="bCredits">Autorzy</button>
  </div>
</div>
<div id="info" class="screen hidden"><h1 id="infoTitle"></h1><div class="box" id="infoBox"></div><button id="bBack">Wróć</button></div>
<div id="choice" class="screen hidden"><h1>Wybór Bilba</h1><p id="choiceQ"></p><div class="btns row2"><button id="bYes">TAK</button><button id="bNo">NIE</button></div></div>
<div id="card" class="screen hidden"><h1 id="cardTitle"></h1><p id="cardText"></p><div class="go">Kliknij, aby kontynuować</div></div>
<div id="overlay" class="screen hidden"><h1 id="ovTitle"></h1><p id="ovText"></p><div class="keys2" id="ovKeys"></div><div class="go" id="ovGo"></div><div class="btns row2" id="ovBtns" style="margin-top:18px"><button id="bMenu2">Menu główne</button></div></div>
<div id="ending" class="screen hidden"><h1 id="endTitle"></h1><p id="endText"></p><div class="btns row2"><button id="bAgain">Zagraj jeszcze raz</button><button id="bMenu">Menu</button></div></div>
<div id="loading" class="screen"><h1>Hobbit</h1><h2>Wczytywanie…</h2><div class="bar"><i id="loadBar"></i></div></div>
<div id="fade" class="layer"></div>

<script>window.CREDITS_MD = /*CREDITS*/"";</script>

/*BUNDLE*/
</script>
</body>
</html>
